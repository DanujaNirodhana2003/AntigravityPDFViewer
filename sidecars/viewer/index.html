<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PDF Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--background, #1e1e1e); color: var(--foreground, #ddd);
    font: 13px system-ui, sans-serif; }
  
  /* Toolbar */
  #bar { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px;
    border-bottom: 1px solid var(--border, #333); background: var(--sidebar, var(--background, #1e1e1e)); }
  #bar button { background: var(--secondary, #2d2d2d); color: var(--foreground, #ddd);
    border: 1px solid var(--border, #444); border-radius: 4px; min-width: 26px; height: 24px; cursor: pointer;
    font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 6px; }
  #bar button:hover { background: var(--accent, #3a3a3a); }
  #bar input { width: 38px; height: 20px; text-align: center; background: var(--background, #1e1e1e);
    color: var(--foreground, #ddd); border: 1px solid var(--border, #444); border-radius: 4px; }
  #name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted-foreground, #999); font-weight: 500; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex: none; }
  #dot.live { background: #3fb950; } #dot.busy { background: #d29922; } #dot.err { background: #f85149; }
  .commentCountBadge { background: #ea8032; color: #101010; font-weight: bold; border-radius: 10px; padding: 1px 6px; font-size: 10px; margin-left: 2px; }

  /* Canvas and Text Layer */
  #scroller { position: absolute; top: 37px; bottom: 0; left: 0; right: 0; overflow: auto; }
  .pages { padding: 12px 0; }
  .page { margin: 0 auto 16px; background: #fff; box-shadow: 0 1px 5px rgba(0,0,0,.5); position: relative; }
  .page canvas { display: block; position: absolute; top: 0; left: 0; }
  .textLayer { position: absolute; text-align: initial; inset: 0; overflow: clip; opacity: 1; line-height: 1; text-size-adjust: none; transform-origin: 0 0; z-index: 2; user-select: text; -webkit-user-select: text; }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgba(0, 100, 255, 0.35); }
  #msg { padding: 24px; color: var(--muted-foreground, #999); white-space: pre-wrap; }

  /* Hover Plus Button (Exact Antigravity style) */
  #hoverPlusBtn { position: fixed; z-index: 100; display: none; width: 24px; height: 24px; border-radius: 50%;
    background: #ea8032; color: #101010; font-size: 16px; font-weight: bold; line-height: 1; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.5); transform: translate(-50%, -50%); user-select: none;
    border: 1.5px solid rgba(255,255,255,0.4); transition: transform 0.1s ease; }
  #hoverPlusBtn:hover { transform: translate(-50%, -50%) scale(1.18); background: #f39c59; }

  /* Native Antigravity-style Inline Comment Box */
  .inlineCommentCard { position: absolute; z-index: 20; width: 88%; left: 6%; box-sizing: border-box;
    background: #181818; border: 1px solid #383838; border-radius: 8px; padding: 12px 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55); font-family: system-ui, -apple-system, sans-serif; color: #fff; }
  .inlineCommentCard .quotePreview { font-size: 11px; font-style: italic; color: #888; border-left: 2px solid #ea8032;
    padding-left: 8px; margin-bottom: 8px; max-height: 40px; overflow: hidden; text-overflow: ellipsis; }
  .inlineCommentCard textarea { width: 100%; min-height: 48px; background: transparent; border: none; outline: none;
    color: #fff; font-family: inherit; font-size: 13px; resize: none; box-sizing: border-box; }
  .inlineCommentCard .cardText { font-size: 13px; color: #eee; white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
  .inlineCommentCard .cardFooter { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .inlineCommentCard .leftBtns { display: flex; align-items: center; gap: 8px; }
  .inlineCommentCard .rightBtns { display: flex; align-items: center; gap: 8px; }
  .inlineCommentCard button { font-family: inherit; cursor: pointer; }
  
  .btnSubtle { background: transparent; border: none; color: #888; font-size: 12px; padding: 4px 6px; }
  .btnSubtle:hover { color: #fff; }
  .btnSecondary { background: #282828; border: 1px solid #444; color: #ddd; border-radius: 4px; padding: 4px 10px; font-size: 12px; }
  .btnSecondary:hover { background: #333; color: #fff; }
  .btnAddComment { background: #ea8032; color: #101010; font-weight: 600; border: none; border-radius: 6px;
    padding: 6px 14px; font-size: 12px; transition: opacity 0.15s ease; }
  .btnAddComment:hover { opacity: 0.9; }

  /* Toast Notification */
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #238636; color: #fff;
    padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: 500; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    z-index: 200; display: none; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; }
  #toast.show { display: block; opacity: 1; }
</style>
</head>
<body>
<div id="bar">
  <span id="dot" title="status"></span>
  <span id="name">PDF Viewer</span>
  <input id="pageIn" title="Page"> <span id="pageCount">/ 0</span>
  <button id="zoomOut" title="Zoom out (-)">−</button>
  <span id="zoomLbl">fit</span>
  <button id="zoomIn" title="Zoom in (+)">+</button>
  <button id="fit" title="Fit width (0)">↔</button>
  <span id="commentStatus" style="font-size:11px; color:#888; margin-left:auto;">Click (+) on any line to comment</span>
</div>

<div id="scroller"><div id="msg">Loading…</div></div>

<!-- Floating Plus Button -->
<div id="hoverPlusBtn" title="Add Comment on this line">+</div>

<!-- Toast Notification -->
<div id="toast">💬 Comment ready! Paste in chat (Ctrl + V)</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const scroller = $('scroller');
const POLL_MS = 500;
const GAP = 16, PAD = 24;

// ---------- backend ----------
async function api(name, body) {
  const r = await fetch('api/' + name, { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error(`api/${name}: HTTP ${r.status}`);
  return r.json();
}

// ---------- status & toast ----------
function status(kind, text) {
  $('dot').className = kind;
  $('dot').title = text || kind;
}
function showMessage(text) {
  scroller.innerHTML = '';
  const d = document.createElement('div'); d.id = 'msg'; d.textContent = text;
  scroller.appendChild(d);
}
let toastTimer;
function showToast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ---------- PDF.js ----------
let pdfjs;
async function loadPdfjs() {
  const [lib, worker] = await Promise.all([api('vendor', { name: 'pdf' }), api('vendor', { name: 'worker' })]);
  const blobUrl = (src) => URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  pdfjs = await import(blobUrl(lib.source));
  pdfjs.GlobalWorkerOptions.workerSrc = blobUrl(worker.source);
}

// ---------- state ----------
const params = new URLSearchParams(location.search);
let file = params.get('file');
let doc = null;
let pages = [];            // [{ el, canvas, textDiv, page, vp, rendered, task }]
let zoom = 'fit';
let scale = 1;
let loadedSig = null;
let pendingSig = null;
let failedSig = null;
let busy = false;
let observer = null;

// Comments: [{ id, pageIndex, yRatio, quote, text }]
let comments = [];

function loadStoredComments() {
  if (!file) return;
  try {
    const raw = sessionStorage.getItem('antigravity_comments_' + file);
    comments = raw ? JSON.parse(raw) : [];
  } catch(e) { comments = []; }
}
function saveComments() {
  if (!file) return;
  try { sessionStorage.setItem('antigravity_comments_' + file, JSON.stringify(comments)); } catch(e) {}
  renderAllComments();
}

const sigOf = (s) => `${s.mtimeMs}:${s.size}`;
const b64ToBytes = (b64) => { const bin = atob(b64); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };

// ---------- position save/restore ----------
function savePosition() {
  if (!pages.length) return null;
  const top = scroller.scrollTop;
  let i = pages.findIndex((p) => p.el.offsetTop + p.el.offsetHeight > top);
  if (i < 0) i = pages.length - 1;
  const el = pages[i].el;
  return { index: i, ratio: (top - el.offsetTop) / el.offsetHeight,
           leftRatio: scroller.scrollWidth ? scroller.scrollLeft / scroller.scrollWidth : 0 };
}
function restorePosition(pos) {
  if (!pos || !pages.length) return;
  const p = pages[Math.min(pos.index, pages.length - 1)].el;
  scroller.scrollTop = p.offsetTop + pos.ratio * p.offsetHeight;
  scroller.scrollLeft = pos.leftRatio * scroller.scrollWidth;
}

// ---------- rendering ----------
function computeScale(firstPage) {
  if (zoom !== 'fit') return zoom;
  const w = firstPage.getViewport({ scale: 1 }).width;
  return Math.max(0.1, (scroller.clientWidth - PAD) / w);
}

async function renderPage(p) {
  if (p.rendered) return;
  p.rendered = true;
  const dpr = window.devicePixelRatio || 1;
  p.canvas.width = Math.floor(p.vp.width * dpr);
  p.canvas.height = Math.floor(p.vp.height * dpr);
  p.task = p.page.render({ canvasContext: p.canvas.getContext('2d'), viewport: p.vp,
                           transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
  
  if (pdfjs.TextLayer && p.textDiv) {
    try {
      const textContentSource = p.page.streamTextContent({ includeMarkedContent: true });
      const textLayer = new pdfjs.TextLayer({
        textContentSource,
        container: p.textDiv,
        viewport: p.vp
      });
      await textLayer.render();
    } catch (err) {
      console.warn('TextLayer error:', err);
    }
  }

  try { await p.task.promise; } catch (e) { if (e?.name !== 'RenderingCancelledException') console.warn(e); }
}

async function show(newDoc, pos) {
  const first = await newDoc.getPage(1);
  scale = computeScale(first);
  $('zoomLbl').textContent = zoom === 'fit' ? 'fit' : Math.round(scale * 100) + '%';

  const container = document.createElement('div');
  container.className = 'pages';
  const list = [];
  for (let i = 1; i <= newDoc.numPages; i++) {
    const page = i === 1 ? first : await newDoc.getPage(i);
    const vp = page.getViewport({ scale });
    const el = document.createElement('div');
    el.className = 'page'; el.dataset.index = i - 1;
    el.style.width = vp.width + 'px'; el.style.height = vp.height + 'px';
    const canvas = document.createElement('canvas');
    canvas.style.width = vp.width + 'px'; canvas.style.height = vp.height + 'px';
    el.appendChild(canvas);
    const textDiv = document.createElement('div');
    textDiv.className = 'textLayer';
    textDiv.style.width = vp.width + 'px'; textDiv.style.height = vp.height + 'px';
    el.appendChild(textDiv);
    container.appendChild(el);
    list.push({ el, canvas, textDiv, page, vp, rendered: false, task: null });
  }

  const idx = pos ? Math.min(pos.index, list.length - 1) : 0;
  await Promise.all(list.slice(Math.max(0, idx - 1), idx + 2).map(renderPage));

  const oldPages = pages, oldDoc = doc;
  observer?.disconnect();
  scroller.replaceChildren(container);
  pages = list; doc = newDoc;
  restorePosition(pos);

  observer = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) renderPage(pages[+e.target.dataset.index]);
  }, { root: scroller, rootMargin: '100% 0px' });
  pages.forEach((p) => observer.observe(p.el));

  $('pageCount').textContent = '/ ' + doc.numPages;
  updatePageNumber();
  renderAllComments();

  oldPages.forEach((p) => p.task?.cancel());
  if (oldDoc && oldDoc !== newDoc) oldDoc.destroy();
}

// ---------- loading / live reload ----------
async function loadFromDisk() {
  const r = await api('read', { file });
  if (!r.ok) throw new Error(r.error);
  const sig = sigOf(r);
  let newDoc;
  try {
    newDoc = await pdfjs.getDocument({ data: b64ToBytes(r.base64) }).promise;
  } catch (e) {
    failedSig = sig;
    throw new Error('Could not parse PDF (still being written?): ' + e.message);
  }
  await show(newDoc, savePosition());
  loadedSig = sig; failedSig = null;
}

async function poll() {
  if (busy || !file) return;
  busy = true;
  try {
    const s = await api('stat', { file });
    if (!s.ok) { status(doc ? 'busy' : 'err', s.error); if (!doc) showMessage('Waiting for file…\n' + s.error); return; }
    const sig = sigOf(s);
    if (sig === loadedSig || sig === failedSig) { status('live', 'Up to date'); return; }
    if (sig === pendingSig && s.complete) {
      status('busy', 'Reloading…');
      await loadFromDisk();
      status('live', 'Reloaded ' + new Date().toLocaleTimeString());
    } else {
      pendingSig = sig;
      status('busy', 'File changing…');
    }
  } catch (e) {
    console.warn(e);
    status('err', String(e.message || e));
    if (!doc) showMessage(String(e.message || e));
  } finally {
    busy = false;
  }
}

// ---------- toolbar & zoom ----------
function updatePageNumber() {
  if (!pages.length) return;
  const mid = scroller.scrollTop + scroller.clientHeight / 3;
  let i = pages.findIndex((p) => p.el.offsetTop + p.el.offsetHeight > mid);
  if (i < 0) i = pages.length - 1;
  if (document.activeElement !== $('pageIn')) $('pageIn').value = i + 1;
}
function goToPage(n) {
  const p = pages[Math.max(1, Math.min(n, pages.length)) - 1];
  if (p) scroller.scrollTop = p.el.offsetTop - GAP;
}
async function setZoom(z) {
  if (!doc) return;
  zoom = z;
  await show(doc, savePosition());
}
const step = (dir) => setZoom(Math.min(5, Math.max(0.25, +(scale * (dir > 0 ? 1.2 : 1 / 1.2)).toFixed(3))));

$('zoomIn').onclick = () => step(1);
$('zoomOut').onclick = () => step(-1);
$('fit').onclick = () => setZoom('fit');
$('pageIn').onchange = (e) => goToPage(parseInt(e.target.value, 10));
scroller.addEventListener('scroll', updatePageNumber, { passive: true });
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === '+' || e.key === '=') step(1);
  else if (e.key === '-') step(-1);
  else if (e.key === '0') setZoom('fit');
});
scroller.addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault(); step(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

let resizeTimer;
new ResizeObserver(() => {
  if (zoom !== 'fit' || !doc) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => show(doc, savePosition()), 150);
}).observe(scroller);

// ---------- Native Antigravity-Style Inline Comment System ----------

const hoverPlus = $('hoverPlusBtn');
let activeHoverTarget = null; // { pageIndex, yRatio, quote, clientX, clientY }
let draftingCard = null;
let isHoveringPlus = false;

hoverPlus.addEventListener('mouseenter', () => { isHoveringPlus = true; });
hoverPlus.addEventListener('mouseleave', () => { isHoveringPlus = false; });

// When user selects text, immediately anchor the (+) button near the selection
document.addEventListener('selectionchange', () => {
  if (draftingCard || isHoveringPlus) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString().trim()) return;

  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return;

  let pageNode = range.commonAncestorContainer;
  while (pageNode && (!pageNode.classList || !pageNode.classList.contains('page'))) {
    pageNode = pageNode.parentElement;
  }
  if (!pageNode) return;

  const pageIndex = parseInt(pageNode.dataset.index, 10);
  const pageRect = pageNode.getBoundingClientRect();
  const yRatio = Math.max(0.02, Math.min(0.95, (rect.top - pageRect.top) / pageRect.height));

  activeHoverTarget = { pageIndex, yRatio, quote: sel.toString().trim(), pageNode };

  hoverPlus.style.display = 'flex';
  hoverPlus.style.left = `${Math.max(16, pageRect.left + 16)}px`;
  hoverPlus.style.top = `${rect.top + 10}px`;
});

// Track mouse position over pages to show the (+) button on lines
scroller.addEventListener('mousemove', (e) => {
  if (draftingCard || isHoveringPlus) return;

  // If already visible and cursor is within 42px of button, FREEZE position so it doesn't vanish while moving towards it!
  if (hoverPlus.style.display === 'flex') {
    const bRect = hoverPlus.getBoundingClientRect();
    const dist = Math.hypot(e.clientX - (bRect.left + bRect.width / 2), e.clientY - (bRect.top + bRect.height / 2));
    if (dist < 42) return;
  }
  
  // Check if hovering over a page
  let target = e.target;
  let pageNode = null;
  while (target && target !== scroller) {
    if (target.classList && target.classList.contains('page')) { pageNode = target; break; }
    target = target.parentElement;
  }
  if (!pageNode) {
    if (!isHoveringPlus) hoverPlus.style.display = 'none';
    return;
  }

  const pageIndex = parseInt(pageNode.dataset.index, 10);
  const pageRect = pageNode.getBoundingClientRect();

  // Check if hovering over text
  let quote = '';
  if (e.target && e.target.tagName === 'SPAN' && e.target.parentElement?.classList?.contains('textLayer')) {
    quote = e.target.textContent.trim();
  }

  const sel = window.getSelection();
  if (sel && !sel.isCollapsed && sel.toString().trim()) {
    quote = sel.toString().trim();
  }

  const yPos = e.clientY;
  const yRatio = Math.max(0.02, Math.min(0.95, (yPos - pageRect.top) / pageRect.height));

  activeHoverTarget = { pageIndex, yRatio, quote, pageNode };

  hoverPlus.style.display = 'flex';
  hoverPlus.style.left = `${pageRect.left + 16}px`;
  hoverPlus.style.top = `${yPos}px`;
});

scroller.addEventListener('mouseleave', (e) => {
  if (draftingCard || isHoveringPlus) return;
  if (e.relatedTarget === hoverPlus || hoverPlus.contains(e.relatedTarget)) return;
  hoverPlus.style.display = 'none';
});

// Click (+) to open the Antigravity inline comment card
hoverPlus.addEventListener('click', (e) => {
  e.stopPropagation();
  hoverPlus.style.display = 'none';
  isHoveringPlus = false;
  if (!activeHoverTarget) return;
  createDraftingComment(activeHoverTarget);
});

function createDraftingComment(target) {
  if (draftingCard) draftingCard.remove();

  const card = document.createElement('div');
  card.className = 'inlineCommentCard';
  card.style.top = `${target.yRatio * 100}%`;

  card.innerHTML = `
    ${target.quote ? `<div class="quotePreview">"${target.quote}"</div>` : ''}
    <textarea placeholder="Type your comment..."></textarea>
    <div class="cardFooter">
      <div class="leftBtns">
        <button class="btnSubtle cancelBtn">Cancel</button>
      </div>
      <div class="rightBtns">
        <button class="btnAddComment">Add Comment</button>
      </div>
    </div>
  `;

  const ta = card.querySelector('textarea');
  const cancelBtn = card.querySelector('.cancelBtn');
  const addBtn = card.querySelector('.btnAddComment');

  cancelBtn.onclick = () => {
    card.remove();
    draftingCard = null;
  };

  addBtn.onclick = () => {
    const text = ta.value.trim();
    if (!text) { card.remove(); draftingCard = null; return; }

    const newComment = {
      id: 'cmt_' + Date.now(),
      pageIndex: target.pageIndex,
      yRatio: target.yRatio,
      quote: target.quote || '',
      text: text
    };
    comments.push(newComment);
    saveComments();
    card.remove();
    draftingCard = null;

    // Automatic Chat Tagging & Clipboard
    copyCommentForChat(newComment);
  };

  target.pageNode.appendChild(card);
  draftingCard = card;
  setTimeout(() => ta.focus(), 30);
}

function copyCommentForChat(c) {
  const docName = file ? file.split(/[\\/]/).pop() : 'document.pdf';
  const pageNum = c.pageIndex + 1;
  const prompt = c.quote 
    ? `> [${docName} - Page ${pageNum}] "${c.quote}"\n${c.text}`
    : `> [${docName} - Page ${pageNum}]\n${c.text}`;

  navigator.clipboard.writeText(prompt).then(() => {
    showToast('💬 Comment copied! Paste in chat (Ctrl + V)');
  });
}

function renderAllComments() {
  document.querySelectorAll('.inlineCommentCard.saved').forEach(el => el.remove());

  comments.forEach((c) => {
    const pageObj = pages[c.pageIndex];
    if (!pageObj || !pageObj.el) return;

    const card = document.createElement('div');
    card.className = 'inlineCommentCard saved';
    card.style.top = `${c.yRatio * 100}%`;

    card.innerHTML = `
      ${c.quote ? `<div class="quotePreview">"${c.quote}"</div>` : ''}
      <div class="cardText">${escapeHtml(c.text)}</div>
      <div class="cardFooter">
        <div class="leftBtns">
          <button class="btnSubtle delBtn">Delete</button>
        </div>
        <div class="rightBtns">
          <button class="btnSecondary copyBtn">📋 Copy</button>
          <button class="btnSecondary editBtn">Edit Comment</button>
        </div>
      </div>
    `;

    card.querySelector('.delBtn').onclick = () => {
      comments = comments.filter(item => item.id !== c.id);
      saveComments();
    };

    card.querySelector('.copyBtn').onclick = () => {
      copyCommentForChat(c);
    };

    card.querySelector('.editBtn').onclick = () => {
      card.innerHTML = `
        ${c.quote ? `<div class="quotePreview">"${c.quote}"</div>` : ''}
        <textarea>${escapeHtml(c.text)}</textarea>
        <div class="cardFooter">
          <div class="leftBtns">
            <button class="btnSubtle cancelEditBtn">Cancel</button>
          </div>
          <div class="rightBtns">
            <button class="btnAddComment saveEditBtn">Save</button>
          </div>
        </div>
      `;
      const ta = card.querySelector('textarea');
      ta.focus();
      card.querySelector('.cancelEditBtn').onclick = renderAllComments;
      card.querySelector('.saveEditBtn').onclick = () => {
        c.text = ta.value.trim() || c.text;
        saveComments();
      };
    };

    pageObj.el.appendChild(card);
  });
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------- Host messages & start ----------
window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.type === 'theme-change' && m.payload?.cssVariables) {
    for (const [k, v] of Object.entries(m.payload.cssVariables)) document.documentElement.style.setProperty(k, v);
  }
  const f = m.payload?.file;
  if (typeof f === 'string' && f !== file) openFile(f);
});

async function openFile(f) {
  file = f;
  loadedSig = pendingSig = failedSig = null;
  const name = f.split(/[\\/]/).pop();
  $('name').textContent = name; $('name').title = f; document.title = name;
  status('busy', 'Loading…');
  loadStoredComments();
  try { await loadFromDisk(); status('live', 'Up to date'); }
  catch (e) { status('err', e.message); if (!doc) showMessage(e.message); }
}

try {
  await loadPdfjs();
  if (file) await openFile(file);
  else showMessage('Click a .pdf file in Antigravity to open it here.');
  setInterval(poll, POLL_MS);
} catch (e) {
  status('err', e.message);
  showMessage('Failed to start PDF viewer:\n' + (e.stack || e.message));
}
</script>
</body>
</html>
